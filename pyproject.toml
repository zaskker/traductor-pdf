[project]
name = "traductor_pdf"
version = "1.0.0-rc1"
description = "Traductor de PDF local con preservación de diseño"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "PyMuPDF>=1.23.0",
    "pymupdf-fonts>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "ruff>=0.3.0",
    "pyinstaller>=6.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/application", "src/domain", "src/infrastructure", "src/ui", "src/main.py"]

[tool.ruff]
line-length = 100
exclude = ["spikes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
